# A push to main whose package.json "version" has no release yet (or pushing a tag vX.Y.Z equal to
# that version) builds Windows and macOS, start-tests the builds (scripts/smoke.js) and publishes a
# GitHub release with the files the in-app updater looks for (src/releases.js). On a main push the
# release (and with it the tag vX.Y.Z) is created here on GitHub, so nobody has to push a tag.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']
  # by hand, e.g. to finish a release whose run failed (a draft is built and uploaded again)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$tag" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json $tag"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            # (a draft left by a failed run is built and uploaded again)
            echo "$tag is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # Created once, here, as a draft: the builds upload into it, "publish" makes it public (and
      # creates the tag on this commit) only when all files are there, since installed apps update
      # as soon as they see a published release.
      - if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Farmies ${TAG#v}" --generate-notes

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.dist }} -- --publish never
      - name: Start test (the unpacked app of this build)
        run: node scripts/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-${{ matrix.os }}
          path: dist/smoke-*.png
          if-no-files-found: ignore
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist/Farmies-*-portable.exe dist/Farmies-*-mac-*.zip)
          gh release upload "$TAG" "${files[@]}" --clobber

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
